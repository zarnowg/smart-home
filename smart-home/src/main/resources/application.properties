spring.application.name=smart-home
server.port=8080

econet24.base-url=https://www.econet24.com
econet24.username=${ECONET_USERNAME:}
econet24.password=${ECONET_PASSWORD:}
econet24.device-uid=${ECONET_DEVICE_UID:FF8HPB0PJ2D1J14A002Z0}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smarthome}
spring.datasource.username=${DB_USERNAME:smarthome}
spring.datasource.password=${DB_PASSWORD:smarthome}
spring.sql.init.mode=always

history.collect-interval=PT1M
history.retention=P365D
